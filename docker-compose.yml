name: logalyzer

services:
  app:
    build: .
    image: logalyzer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGO_URL: mongodb://mongo:27017/logalyzer
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    restart: unless-stopped
    # Only reachable locally: for «npm run dev» with MONGO_URL=mongodb://localhost:27017/logalyzer
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
